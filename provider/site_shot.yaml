identity:
  author: site-shot
  name: site_shot
  label:
    en_US: Site-Shot
  description:
    en_US: Turn a public web page URL into a PNG or JPEG screenshot file.
  icon: icon.svg
  tags:
    - image
    - utilities
credentials_for_provider:
  api_key:
    type: secret-input
    required: true
    label:
      en_US: Site-Shot API key
    placeholder:
      en_US: Paste your Site-Shot API key
    help:
      en_US: The key of a Site-Shot account with a paid plan or included capture quota. Every capture counts toward that plan.
    url: https://www.site-shot.com/#documentation
tools:
  - tools/capture_screenshot.yaml
extra:
  python:
    source: provider/site_shot.py
